---
- name: cleanup | Uninstalling Packages
  apt:
    name: []
    state: absent
  become: true
  when: ansible_os_family == "Debian"

- name: cleanup | Checking if /etc/machine-id exists
  stat:
    path: /etc/machine-id
  register: _machine_id

- name: cleanup | Clearing /etc/machine-id
  copy:
    content: ""
    dest: /etc/machine-id
  become: true
  when: _machine_id.stat.exists|bool

- name: cleanup | Cleaning Up Apt
  command: "{{ item }}"
  become: true
  loop:
    - apt-get autoremove -y
    - apt-get clean -y
    - apt-get autoclean -y
  when: ansible_os_family == "Debian"

- name: cleanup | Cleaning Up Yum
  command: "{{ item }}"
  become: true
  loop:
    - yum clean all
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution != "Fedora"

- name: cleanup | Cleaning Up DNF
  command: "{{ item }}"
  become: true
  loop:
    - dnf clean all
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution == "Fedora"

- name: cleanup | Finding Log Files to Clean in /var/log
  find:
    paths: /var/log
    patterns: "*.log"
    recurse: true
  become: true
  register: _log_files

- name: cleanup | Cleaning Up Log Files in /var/log
  file:
    path: "{{ item.path }}"
    state: absent
  become: true
  loop: "{{ _log_files.files }}"

- name: cleanup | Zeroing Out Free Space to Save Space in the Final Image
  shell: |
    dd if=/dev/zero of=/EMPTY bs=1M
    rm -f /EMPTY
    sync
    sync
    sync
    fstrim -av
    sync
  become: true
  failed_when: false
